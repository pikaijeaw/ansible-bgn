---
# Lab 15: Windows Server baseline (ทำงานเหมือน lab02 + lab07 แต่ฝั่ง Windows)
- name: Windows server baseline
  hosts: windows
  gather_facts: true

  vars:
    win_timezone: SE Asia Standard Time
    win_local_admins: [Administrator, svc-ansible]
    win_choco_packages: [7zip, notepadplusplus, googlechrome]

  tasks:
    - name: Connectivity check
      ansible.windows.win_ping:

    - name: Set timezone
      community.windows.win_timezone:
        timezone: "{{ win_timezone }}"

    - name: Install common tools with Chocolatey
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ win_choco_packages }}"
        state: present

    - name: "[CIS 18.3.x] Disable SMBv1 server"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword

    - name: Disable TLS 1.0 for SCHANNEL server
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server
        name: Enabled
        data: 0
        type: dword

    - name: Require Network Level Authentication for RDP
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 1
        type: dword

    - name: Disable Print Spooler on servers (PrintNightmare)
      ansible.windows.win_service:
        name: Spooler
        start_mode: disabled
        state: stopped

    - name: Enforce local Administrators membership
      ansible.windows.win_group_membership:
        name: Administrators
        members: "{{ win_local_admins }}"
        state: pure          # ลบคนที่ไม่อยู่ในรายการออก

    - name: Allow monitoring agent port in Windows Firewall
      community.windows.win_firewall_rule:
        name: Monitoring windows_exporter
        localport: 9182
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true

    - name: Report disk free space
      ansible.windows.win_shell: |
        Get-PSDrive -PSProvider FileSystem |
          Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
          ConvertTo-Json
      register: disks
      changed_when: false

    - name: Show disks
      ansible.builtin.debug:
        msg: "{{ disks.stdout | from_json }}"

- name: IIS web server
  hosts: iis
  tasks:
    - name: Install IIS role
      ansible.windows.win_feature:
        name: [Web-Server, Web-Mgmt-Console]
        state: present
        include_management_tools: true
      register: iis

    - name: Reboot if the feature install requires it
      ansible.windows.win_reboot:
      when: iis.reboot_required

    - name: Deploy default page
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: "<h1>{{ inventory_hostname }} - managed by Ansible</h1>"
