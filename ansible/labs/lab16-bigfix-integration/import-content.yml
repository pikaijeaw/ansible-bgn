---
# Lab 16.3: เก็บ Fixlet/Task/Analysis (.bes) ไว้ใน Git แล้ว import เข้า BigFix custom site อัตโนมัติ
# (แนวคิด "BigFix content as code": review ผ่าน pull request ก่อนเข้า production)
- name: Import BigFix content from the repository
  hosts: localhost
  gather_facts: false

  vars:
    bes_root: "{{ (playbook_dir ~ '/../../../bigfix/labs') | realpath }}"
    bes_files: "{{ found.files | map(attribute='path') | sort }}"

  tasks:
    - name: Find .bes files in every BigFix lab
      ansible.builtin.find:
        paths: "{{ bes_root }}"
        patterns: "*.bes"
        recurse: true
      register: found

    - name: Fail if no content found
      ansible.builtin.assert:
        that: bes_files | length > 0
        fail_msg: "no .bes files under {{ bes_root }}"

    - name: Validate every file is well-formed XML before upload
      ansible.builtin.command: python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" {{ item }}
      loop: "{{ bes_files }}"
      loop_control:
        label: "{{ item | basename }}"
      changed_when: false

    - name: Import into custom site (endpoint depends on the content type)
      ansible.builtin.uri:
        url: "{{ bigfix_url }}/api/{{ endpoint[kind] }}/custom/{{ bigfix_custom_site | urlencode }}"
        method: POST
        user: "{{ bigfix_user }}"
        password: "{{ bigfix_password }}"
        force_basic_auth: true
        validate_certs: "{{ bigfix_validate_certs }}"
        headers:
          Content-Type: application/xml
        body: "{{ lookup('ansible.builtin.file', item) }}"
        return_content: true
      loop: "{{ bes_files }}"
      loop_control:
        label: "{{ kind }}: {{ item | basename }}"
      register: imported
      vars:
        kind: "{{ lookup('ansible.builtin.file', item) | regex_search('<(Fixlet|Task|Analysis|ComputerGroup)>', '\\1') | first }}"
        endpoint:
          Fixlet: fixlets
          Task: tasks
          Analysis: analyses
          ComputerGroup: computergroups

    - name: Show new IDs
      ansible.builtin.debug:
        msg: "{{ imported.results | map(attribute='content') | map('regex_search', '<Name>([^<]+)</Name><ID>(\\d+)</ID>', '\\1', '\\2') | list }}"
